<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Motorista | Rota++</title>
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Motorista">
    <link rel="manifest" href="/motorista.manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg">
    <link rel="apple-touch-icon" href="/icons/icon-192.svg">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
        body {
            min-height: 100dvh;
            background:
                radial-gradient(1200px 600px at 0% 0%, rgba(37, 99, 235, 0.85), transparent 60%),
                radial-gradient(900px 500px at 100% 100%, rgba(14, 165, 233, 0.7), transparent 60%),
                linear-gradient(135deg, #0f172a 0%, #1e3a8a 60%, #1e40af 100%);
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 24px;
            padding: 32px 24px 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
        }
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 88px;
            height: 88px;
            margin: 0 auto 16px;
            border-radius: 26px;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            font-size: 44px;
            box-shadow: 0 12px 28px rgba(37, 99, 235, 0.45);
        }
        h1 {
            text-align: center;
            font-size: 22px;
            margin: 6px 0 4px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }
        .sub {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            margin: 0 0 22px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #cbd5e1;
            margin: 14px 0 6px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 14px;
            padding: 14px 14px;
            font-size: 16px;
            color: #e2e8f0;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.22);
        }
        button {
            width: 100%;
            margin-top: 22px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: #fff;
            border: 0;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.4px;
            cursor: pointer;
            box-shadow: 0 14px 28px rgba(37, 99, 235, 0.45);
            transition: transform 0.12s ease;
        }
        button:active { transform: scale(0.98); }
        button[disabled] { opacity: 0.65; cursor: wait; }
        .msg {
            min-height: 20px;
            margin-top: 14px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: #fca5a5;
        }
        .footer-note {
            text-align: center;
            margin-top: 18px;
            font-size: 11px;
            color: #64748b;
        }
        .footer-note a { color: #93c5fd; text-decoration: none; }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(37, 99, 235, 0.22);
            color: #bfdbfe;
            font-size: 11px;
            font-weight: 600;
            margin: 0 auto 16px;
        }
        .chip-wrap { display: flex; justify-content: center; }
    </style>
</head>
<body>
    <div class="card" role="form" aria-label="Login do motorista">
        <div class="logo" aria-hidden="true">🚚</div>
        <div class="chip-wrap"><span class="chip">● Acesso exclusivo</span></div>
        <h1>App do Motorista</h1>
        <p class="sub">Entre com suas credenciais para iniciar suas rotas do dia.</p>

        <form id="form-login" autocomplete="on">
            <label for="login">Usuário</label>
            <input id="login" name="login" type="text" autocomplete="username" inputmode="text" autocapitalize="none" autocorrect="off" required>

            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" autocomplete="current-password" required>

            <button type="submit" id="btn-entrar">Entrar</button>
            <div class="msg" id="msg" role="alert" aria-live="polite"></div>
        </form>

        <div class="footer-note">
            Não é motorista? <a href="/index.html">Acessar painel gerencial</a>
        </div>
    </div>

    <script src="/js/api-client.js"></script>
    <script>
        (function () {
            if (localStorage.getItem('auth_token') && localStorage.getItem('tipo_app') === 'motorista') {
                window.location.replace('/operacao/motorista.html');
                return;
            }
            const form = document.getElementById('form-login');
            const btn = document.getElementById('btn-entrar');
            const msg = document.getElementById('msg');

            form.addEventListener('submit', async function (ev) {
                ev.preventDefault();
                msg.innerText = '';
                btn.disabled = true;
                btn.innerText = 'Entrando...';

                const payload = {
                    login: document.getElementById('login').value.trim(),
                    senha: document.getElementById('senha').value
                };

                try {
                    const resp = await fetch('/api/login/motorista', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await resp.json().catch(function () { return {}; });
                    if (!resp.ok) {
                        msg.innerText = (data && data.erro) || 'Falha no login.';
                        btn.disabled = false;
                        btn.innerText = 'Entrar';
                        return;
                    }

                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('tipo_app', 'motorista');

                    const m = data.motorista || {};
                    const empresaLocal = {
                        id: m.empresa_id,
                        empresa_id: m.empresa_id,
                        nome: m.empresa_nome,
                        api_mapas: m.api_mapas,
                        cor1: m.cor1,
                        caminho_logo: m.caminho_logo,
                        base_lat: m.base_lat,
                        base_lng: m.base_lng
                    };
                    localStorage.setItem('dados_empresa', JSON.stringify(empresaLocal));
                    localStorage.setItem('dados_operador', JSON.stringify({
                        id: m.id,
                        nome: m.nome,
                        login: m.login,
                        perfil: m.perfil,
                        empresa_id: m.empresa_id
                    }));

                    window.location.replace('/operacao/motorista.html');
                } catch (err) {
                    msg.innerText = 'Erro de conexão. Tente novamente.';
                    btn.disabled = false;
                    btn.innerText = 'Entrar';
                }
            });
        })();
    </script>
    <script src="/js/footer-rfs.js?v=1" defer></script>
    <script src="/js/pwa-bootstrap.js?v=1" defer></script>
</body>
</html>
